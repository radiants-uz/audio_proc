# Общая часть для server { listen 80 } и server { listen 443 ssl } — всё уходит в backend-api.

client_max_body_size 2G;
# Стримим тело запроса в бэкенд, не буферизуя 2G-аплоады на диск
proxy_request_buffering off;

location ~ /\. {
    deny all;
}

location = /favicon.ico {
    root /app/static;
    access_log off;
    log_not_found off;
    add_header Cache-Control "public";
    expires 30d;
}

