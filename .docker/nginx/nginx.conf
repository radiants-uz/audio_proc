user nginx;
# user  root;
worker_processes auto;

pid /run/nginx.pid;


events {
    worker_connections 4096;
    multi_accept on;
}


http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_authorization $auth_present {
        default "present";
        "" "absent";
    }

    # === Request ID ===
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        "" "$msec-$pid-$connection-$request_length";
    }
    proxy_set_header X-Request-ID $req_id;
    add_header X-Request-ID $req_id always;

    # escape=json — чтобы спец.символы не ломали JSON
    log_format json_main escape=json
    '{'
    '"@timestamp":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"x_forwarded_for":"$http_x_forwarded_for",'

    '"request_id":"$req_id",'
    '"auth_present":"$auth_present",'

    '"request_method":"$request_method",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"bytes_sent":$bytes_sent,'
    '"referer":"$http_referer",'

    '"ua":"$http_user_agent",'
    '"cua":"$http_custom_user_agent",'
    '"scheme":"$scheme",'
    '"protocol":"$server_protocol",'
    '"host":"$host",'
    '"uri":"$uri",'
    '"args":"$args",'

    # полное время запроса
    '"request_time":$request_time,'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'

    # время ответа апстрима
    '"upstream_response_time":"$upstream_response_time",'
    '"upstream_connect_time":"$upstream_connect_time",'
    '"upstream_header_time":"$upstream_header_time"'
    '}';

    # уровни: debug|info|notice|warn|error|crit
    access_log /dev/stdout json_main;
    error_log /dev/stderr warn;

    sendfile on;

    keepalive_timeout 65;

    # В Docker Compose нужен встроенный DNS; в K8s — убрать resolver и 'resolve' в upstream.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;

    # === UPSTREAMS ===
    # Upstream c разделяемым состоянием и пере-резолвом
    upstream fastapi {
        zone django_zone 64k;
        server backend-api:8000 resolve max_fails=3 fail_timeout=30s;
        keepalive 32;
    }


    # === Заголовки от внешнего reverse-proxy ===
    # Перед этим nginx стоит ещё один прокси (api.doc-processor.devr.uz -> этот хост),
    # который терминирует TLS. Если он прислал X-Forwarded-Proto / X-Real-IP —
    # пробрасываем их как есть, иначе берём свои значения (прямой заход на 80/443).
    map $http_x_forwarded_proto $fwd_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }
    map $http_x_real_ip $real_ip {
        default $http_x_real_ip;
        "" $remote_addr;
    }

    # Правильная обработка Upgrade/Connection для WebSocket
    # Если заголовок Upgrade пуст — закрываем соединение, иначе — upgrade.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # =========================================================
    # 1. HTTP - порт 80
    # =========================================================
    server {
        listen 80;
        server_name _;

        include /etc/nginx/proxy.conf;
    }

    # =========================================================
    # 2. HTTPS - порт 443
    # Сертификаты монтируются из .docker/nginx/certs/ (fullchain.pem + privkey.pem).
    # Для локальной проверки: scripts/gen-selfsigned-cert.sh
    # =========================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        include /etc/nginx/proxy.conf;
    }

}