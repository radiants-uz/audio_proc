user nginx;
# user  root;
worker_processes auto;

pid /run/nginx.pid;


events {
    worker_connections 4096;
    multi_accept on;
}


http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_authorization $auth_present {
        default "present";
        "" "absent";
    }

    # === Request ID ===
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        "" "$msec-$pid-$connection-$request_length";
    }
    proxy_set_header X-Request-ID $req_id;
    add_header X-Request-ID $req_id always;

    # escape=json — чтобы спец.символы не ломали JSON
    log_format json_main escape=json
    '{'
    '"@timestamp":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"x_forwarded_for":"$http_x_forwarded_for",'

    '"request_id":"$req_id",'
    '"auth_present":"$auth_present",'

    '"request_method":"$request_method",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"bytes_sent":$bytes_sent,'
    '"referer":"$http_referer",'

    '"ua":"$http_user_agent",'
    '"cua":"$http_custom_user_agent",'
    '"scheme":"$scheme",'
    '"protocol":"$server_protocol",'
    '"host":"$host",'
    '"uri":"$uri",'
    '"args":"$args",'

    # полное время запроса
    '"request_time":$request_time,'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'

    # время ответа апстрима
    '"upstream_response_time":"$upstream_response_time",'
    '"upstream_connect_time":"$upstream_connect_time",'
    '"upstream_header_time":"$upstream_header_time"'
    '}';

    # уровни: debug|info|notice|warn|error|crit
    access_log /dev/stdout json_main;
    error_log /dev/stderr warn;

    sendfile on;

    keepalive_timeout 65;

    # В Docker Compose нужен встроенный DNS; в K8s — убрать resolver и 'resolve' в upstream.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;

    # === UPSTREAMS ===
    # Upstream c разделяемым состоянием и пере-резолвом
    upstream fastapi {
        zone fastapi_zone 64k;
        server backend-api:8000 resolve max_fails=3 fail_timeout=30s;
        keepalive 32;
    }


    # === Заголовки от внешнего reverse-proxy ===
    # Этот nginx стоит ЗА хостовым nginx сервера (см. ~/nginx-host на сервере):
    # хост принимает :80/:443, терминирует TLS и проксирует по префиксу пути
    # на 127.0.0.1:${NGINX_HTTP_HOST_PORT}. Поэтому здесь только HTTP.
    #
    # Реальный IP клиента приходит в X-Real-IP / X-Forwarded-For от хоста.
    # Порт на хосте привязан к 127.0.0.1, так что доверяем docker-сетям и loopback.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;

    # Если внешний прокси прислал X-Forwarded-Proto / X-Real-IP — пробрасываем
    # их как есть, иначе берём свои значения (прямой заход на порт контейнера).
    map $http_x_forwarded_proto $fwd_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }
    map $http_x_real_ip $real_ip {
        default $http_x_real_ip;
        "" $remote_addr;
    }

    # Правильная обработка Upgrade/Connection для WebSocket
    # Если заголовок Upgrade пуст — закрываем соединение, иначе — upgrade.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # =========================================================
    # HTTP - порт 80 (единственный: TLS терминируется на хостовом nginx)
    # =========================================================
    server {
        listen 80;
        server_name _;

        include /etc/nginx/proxy.conf;
    }

}
