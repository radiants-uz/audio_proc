name: audio-processor

services:
  minio:
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    # 9000 нужен наружу, чтобы внешний reverse-proxy мог отдавать presigned-ссылки
    # (S3_EXTERNAL_URL). Консоль (9001) наружу не выставляем.
    ports:
      - "${MINIO_HOST_PORT:-9200}:9000"
    volumes:
      - miniodata:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always
    networks:
      - audio-net

  setup-minio:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_STORAGE_BUCKET: ${S3_STORAGE_BUCKET}
      S3_ASSETS_BUCKET: ${S3_ASSETS_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_USER: ${S3_USER}
      S3_USER_PASS: ${S3_USER_PASS}
    volumes:
      - ./.docker/minio/policies:/policies
      - ./.docker/minio/init_minio.sh:/init_minio.sh
    entrypoint: ["/bin/sh", "/init_minio.sh"]
    restart: on-failure
    networks:
      - audio-net

  backend-api:
    build:
      context: ./backend
      target: prod
      args:
        WITH_LIBREOFFICE: ${WITH_LIBREOFFICE:-1}
    env_file: .env
    environment:
      FORWARDED_ALLOW_IPS: "*"
      # Префикс, под которым API опубликован на хостовом nginx
      # (http://<host>/audio-proc/...). Хост срезает префикс, uvicorn через
      # root_path подставляет его в /docs, redirect'ы и url_for. Пустая
      # строка — публикация с корня (например, свой домен).
      UVICORN_ROOT_PATH: ${API_ROOT_PATH-/audio-proc}
    expose:
      - 8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      setup-minio:
        condition: service_completed_successfully
      backend-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    networks:
      - audio-net

  backend-worker:
    build:
      context: ./backend
      target: prod
      args:
        WITH_LIBREOFFICE: ${WITH_LIBREOFFICE:-1}
    command: arq app.workers.arq_worker.WorkerSettings
    env_file: .env
    volumes:
      - hf-cache:/home/appuser/.cache
      - worker-tmp:/tmp/audio-proc
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      setup-minio:
        condition: service_completed_successfully
      backend-migrate:
        condition: service_completed_successfully
    # GPU: раскомментировать на сервере с nvidia-container-toolkit и выставить AUDIO_DEVICE=cuda.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    restart: always
    networks:
      - audio-net

  backend-migrate:
    build:
      context: ./backend
      target: prod
      args:
        WITH_LIBREOFFICE: ${WITH_LIBREOFFICE:-1}
    command: alembic upgrade head
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - audio-net

  nginx:
    image: nginx:stable-alpine
    # Порт 80 сервера занят хостовым nginx — он принимает трафик и проксирует
    # /audio-proc/ → 127.0.0.1:8081 (сюда). Наружу порт не публикуем; TLS — на хосте.
    ports:
      - "${NGINX_BIND_ADDR:-127.0.0.1}:${NGINX_HTTP_HOST_PORT:-8081}:80"
    volumes:
      - ./.docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./.docker/nginx/proxy.conf:/etc/nginx/proxy.conf:ro
      - ./backend/static:/app/static:ro
    depends_on:
      backend-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - audio-net

volumes:
  miniodata:
  hf-cache:
  worker-tmp:
