name: audio-processor

# Prod: хранилище — внешнее S3 (S3_ENDPOINT_URL/S3_EXTERNAL_URL/ключи в .env).
# MinIO в prod не входит; для прод-стека с локальным MinIO добавьте
# docker-compose.minio.yml (sh scripts/run.sh --with-minio up).

services:

  backend-api:
    build:
      context: ./backend
      target: prod
      args:
        WITH_LIBREOFFICE: ${WITH_LIBREOFFICE:-1}
    env_file: .env
    environment:
      FORWARDED_ALLOW_IPS: "*"
      # Префикс, под которым API опубликован на хостовом nginx
      # (http://<host>/audio-proc/...). Хост срезает префикс, uvicorn через
      # root_path подставляет его в /docs, redirect'ы и url_for. Пустая
      # строка — публикация с корня (например, свой домен).
      UVICORN_ROOT_PATH: ${API_ROOT_PATH-/audio-proc}
    expose:
      - 8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    networks:
      - audio-net

  backend-worker:
    build:
      context: ./backend
      target: prod
      args:
        WITH_LIBREOFFICE: ${WITH_LIBREOFFICE:-1}
    command: arq app.workers.arq_worker.WorkerSettings
    env_file: .env
    volumes:
      - hf-cache:/home/appuser/.cache
      - worker-tmp:/tmp/audio-proc
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-migrate:
        condition: service_completed_successfully
    # GPU: раскомментировать на сервере с nvidia-container-toolkit и выставить AUDIO_DEVICE=cuda.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    restart: always
    networks:
      - audio-net

  backend-migrate:
    build:
      context: ./backend
      target: prod
      args:
        WITH_LIBREOFFICE: ${WITH_LIBREOFFICE:-1}
    command: alembic upgrade head
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - audio-net

  nginx:
    image: nginx:stable-alpine
    # Порт 80 сервера занят хостовым nginx — он принимает трафик и проксирует
    # /audio-proc/ → 127.0.0.1:8081 (сюда). Наружу порт не публикуем; TLS — на хосте.
    ports:
      - "${NGINX_BIND_ADDR:-127.0.0.1}:${NGINX_HTTP_HOST_PORT:-8081}:80"
    volumes:
      - ./.docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./.docker/nginx/proxy.conf:/etc/nginx/proxy.conf:ro
      - ./backend/static:/app/static:ro
    depends_on:
      backend-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - audio-net

volumes:
  hf-cache:
  worker-tmp:
